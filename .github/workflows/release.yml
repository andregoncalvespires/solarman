name: Release

# Run manually (Actions → Release → Run workflow) from the main branch.
# Bumps the version in manifest.json, commits, tags vX.Y.Z and publishes a
# GitHub Release with auto-generated notes and a solarman.zip asset.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: |
          pip install pytest pyyaml pytest-homeassistant-custom-component pysolarmanv5
          pytest -q
      - name: Bump version in manifest.json
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json, os
          path = "custom_components/solarman/manifest.json"
          manifest = json.load(open(path, encoding="utf-8"))
          major, minor, patch = (int(x) for x in manifest["version"].split("."))
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          manifest["version"] = f"{major}.{minor}.{patch}"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={manifest['version']}\n")
          PY
      - name: Commit, tag and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/solarman/manifest.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main --follow-tags
      - name: Build zip
        run: |
          cd custom_components/solarman
          zip -r ../../solarman.zip . -x '__pycache__/*' '*.pyc'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" solarman.zip \
            --title "v${VERSION}" --generate-notes --verify-tag
